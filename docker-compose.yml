name: ${COMPOSE_PROJECT_NAME:-retail-data-demo}

x-demo-environment: &demo-environment
  KAFKA_BOOTSTRAP: redpanda:9092
  AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
  AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT:-}
  AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-kmart-demo}
  AZURE_STORAGE_KEY: ${AZURE_STORAGE_KEY:-}
  AZURE_STORAGE_PREFIX: ${AZURE_STORAGE_PREFIX:-retail-data-demo}
  DATABRICKS_STORAGE_BASE_PATH: ${DATABRICKS_STORAGE_BASE_PATH:-}
  DEMO_RUNTIME_ROOT: /workspace/runtime
  DEMO_TRADING_DATE: ${DEMO_TRADING_DATE:-2026-08-14}
  STORE_COUNT: ${STORE_COUNT:-325}
  SKU_COUNT: ${SKU_COUNT:-2000}
  TXN_PER_STORE: ${TXN_PER_STORE:-200}
  DEMO_SEED: ${DEMO_SEED:-20260814}
  WMS_HOST: wms-sftp
  WMS_PORT: "22"
  WMS_USER: ${WMS_USER:-demo}
  WMS_PASSWORD: ${WMS_PASSWORD:-demo}

x-toolbox: &toolbox
  image: retail-demo/toolbox:2.0
  build:
    context: .
    dockerfile: infra/toolbox/Dockerfile
  environment: *demo-environment
  working_dir: /workspace
  volumes:
    - ./:/workspace
    - wms-data:/wms
  networks: [demo]

x-airflow-environment: &airflow-environment
  <<: *demo-environment
  DEMO_RUNTIME_ROOT: /opt/airflow/runtime
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__PARALLELISM: "8"
  AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "8"
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://127.0.0.1:8080/execution/
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-retail-demo-jwt-signing-key-2026-control-plane-a-0123456789-abcdefghij}
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:-retail-demo-log-signing-key-2026-control-plane-a-9876543210-jihgfedcba}
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/state/airflow.db
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER:-admin}:admin
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_manager_passwords.json.generated
  AIRFLOW__API__BASE_URL: http://localhost:8080
  AIRFLOW_CONN_DATABRICKS_DEFAULT: '{"conn_type":"databricks","host":"${DATABRICKS_HOST:-}","password":"${DATABRICKS_TOKEN:-}","extra":{"token":"${DATABRICKS_TOKEN:-}","retry_limit":3,"retry_delay":5}}'
  AIRFLOW_CONN_DBT_CLOUD_DEFAULT: '{"conn_type":"dbt_cloud","host":"${DBT_CLOUD_HOST:-cloud.getdbt.com}","login":"${DBT_CLOUD_ACCOUNT_ID:-0}","password":"${DBT_CLOUD_SERVICE_TOKEN:-}"}'
  DEMO_AIRFLOW_SCHEDULE: ${DEMO_AIRFLOW_SCHEDULE:-}
  PYTHONPATH: /opt/airflow:/opt/airflow/dags

services:
  redpanda:
    image: redpandadata/redpanda:v25.2.10
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=768M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://${KAFKA_ADVERTISED_HOST:-localhost}:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: [CMD-SHELL, "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [demo]

  redpanda-console:
    image: redpandadata/console:v3.2.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8081:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    networks: [demo]

  kafka-init:
    image: redpandadata/redpanda:v25.2.10
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        rpk topic create pos.transactions.v1 --brokers redpanda:9092 --partitions 6 || true
        rpk topic create pos.store-eod.v1 --brokers redpanda:9092 --partitions 3 || true
        rpk topic create retail.store-eod-readiness-command.v1 --brokers redpanda:9092 --partitions 1 --topic-config cleanup.policy=compact || true
        rpk topic create retail.store-eod-readiness-state.v1 --brokers redpanda:9092 --partitions 1 --topic-config cleanup.policy=compact || true
        rpk topic create retail.store-eod-readiness.v1 --brokers redpanda:9092 --partitions 1 || true
        rpk topic list --brokers redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
    networks: [demo]

  eod-readiness:
    <<: *toolbox
    command: [python, -m, demo.eod_readiness, run]
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  wms-sftp:
    image: atmoz/sftp:alpine
    command: ${WMS_USER:-demo}:${WMS_PASSWORD:-demo}:1001::inbound/replen,ack,reject,state
    ports:
      - "2222:22"
    volumes:
      - wms-data:/home/${WMS_USER:-demo}
    healthcheck:
      test: [CMD-SHELL, "ps | grep -q '[s]shd'"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [demo]

  wms-ack-writer:
    <<: *toolbox
    command: [python, -m, demo.wms_ack]
    restart: unless-stopped
    depends_on:
      wms-sftp:
        condition: service_healthy

  airflow-init:
    image: retail-demo/airflow:3.3.0
    environment: *airflow-environment
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -ec
      - chown -R ${AIRFLOW_UID:-50000}:0 /opt/airflow/state
    volumes:
      - airflow-state:/opt/airflow/state
    restart: "no"
    networks: [demo]

  airflow:
    image: retail-demo/airflow:3.3.0
    build:
      context: .
      dockerfile: infra/airflow/Dockerfile
    environment: *airflow-environment
    user: "${AIRFLOW_UID:-50000}:0"
    command: standalone
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/config:/opt/airflow/config
      - ./demo:/opt/airflow/demo
      - ./runtime:/opt/airflow/runtime
      - airflow-state:/opt/airflow/state
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      wms-sftp:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8080/api/v2/monitor/health]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [demo]

  toolbox:
    <<: *toolbox
    profiles: [tools]
    command: [python, -m, demo.cli, --help]

volumes:
  redpanda-data:
  wms-data:
  airflow-state:

networks:
  demo:
    name: retail-data-demo
